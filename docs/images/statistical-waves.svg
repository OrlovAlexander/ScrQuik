<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
<rect width="980" height="520" fill="#f7f7f4"/>
<text x="24" y="28" font-family="Arial" font-size="16" fill="#111111" font-weight="bold">Статистические волны Кречетова</text>
<text x="24" y="48" font-family="Arial" font-size="12" fill="#444444">точки 1–5, канал, вход у 5, цель — линия 1–4, стоп за 5. Нога 4→5 не длиннее 2→3</text>

<rect x="20" y="64" width="460" height="400" fill="#ffffff" stroke="#dddddd"/>
<text x="32" y="86" font-family="Arial" font-size="14" fill="#1a8f3a" font-weight="bold">правая (рост)</text>
<text x="32" y="104" font-family="Arial" font-size="11" fill="#555555">голова и плечи, шея 2–4 вниз</text>
<line x1="48" y1="168" x2="460" y2="238" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
<line x1="48" y1="302" x2="460" y2="372" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
<line x1="86" y1="292" x2="455" y2="176" stroke="#2b6cb0" stroke-width="2" fill="none"/>
<polyline points="86,292 164,190 250,340 336,222 422,300" fill="none" stroke="#222222" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="406" y1="322" x2="438" y2="322" stroke="#cc4433" stroke-width="3"/>
<line x1="422" y1="300" x2="422" y2="254" stroke="#1a8f3a" stroke-width="2.5"/>
<polygon points="422,248 415,262 429,262" fill="#1a8f3a"/>
<circle cx="86" cy="292" r="11" fill="#2b6cb0"/><text x="86" y="296" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">1</text>
<circle cx="164" cy="190" r="11" fill="#2b6cb0"/><text x="164" y="194" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">2</text>
<circle cx="250" cy="340" r="11" fill="#2b6cb0"/><text x="250" y="344" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">3</text>
<circle cx="336" cy="222" r="11" fill="#2b6cb0"/><text x="336" y="226" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">4</text>
<circle cx="422" cy="300" r="11" fill="#2b6cb0"/><text x="422" y="304" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">5</text>
<text x="200" y="274" font-family="Arial" font-size="11" fill="#666666">2→3</text>
<text x="350" y="270" font-family="Arial" font-size="11" fill="#666666">4→5 короче</text>
<text x="400" y="170" font-family="Arial" font-size="11" fill="#2b6cb0">цель 1–4</text>
<text x="444" y="326" font-family="Arial" font-size="11" fill="#cc4433">стоп</text>
<text x="432" y="248" font-family="Arial" font-size="11" fill="#1a8f3a">вход</text>
<text x="32" y="448" font-family="Arial" font-size="11" fill="#333333">после 5 вверх к 1–4; точка 3 — опора</text>

<rect x="500" y="64" width="460" height="400" fill="#ffffff" stroke="#dddddd"/>
<text x="512" y="86" font-family="Arial" font-size="14" fill="#cc4433" font-weight="bold">левая (снижение)</text>
<text x="512" y="104" font-family="Arial" font-size="11" fill="#555555">три вершины и три впадины</text>
<line x1="528" y1="248" x2="940" y2="132" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
<line x1="528" y1="368" x2="940" y2="252" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
<line x1="588" y1="232" x2="940" y2="356" stroke="#2b6cb0" stroke-width="2" fill="none"/>
<polyline points="536,360 588,232 654,320 724,192 794,298 868,222" fill="none" stroke="#222222" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="852" y1="200" x2="884" y2="200" stroke="#cc4433" stroke-width="3"/>
<line x1="868" y1="222" x2="868" y2="268" stroke="#cc4433" stroke-width="2.5"/>
<polygon points="868,274 861,260 875,260" fill="#cc4433"/>
<circle cx="588" cy="232" r="11" fill="#2b6cb0"/><text x="588" y="236" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">1</text>
<circle cx="654" cy="320" r="11" fill="#2b6cb0"/><text x="654" y="324" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">2</text>
<circle cx="724" cy="192" r="11" fill="#2b6cb0"/><text x="724" y="196" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">3</text>
<circle cx="794" cy="298" r="11" fill="#2b6cb0"/><text x="794" y="302" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">4</text>
<circle cx="868" cy="222" r="11" fill="#2b6cb0"/><text x="868" y="226" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">5</text>
<text x="678" y="248" font-family="Arial" font-size="11" fill="#666666">2→3</text>
<text x="808" y="248" font-family="Arial" font-size="11" fill="#666666">4→5 короче</text>
<text x="880" y="360" font-family="Arial" font-size="11" fill="#2b6cb0">цель 1–4</text>
<text x="888" y="204" font-family="Arial" font-size="11" fill="#cc4433">стоп</text>
<text x="878" y="282" font-family="Arial" font-size="11" fill="#cc4433">вход</text>
<text x="512" y="448" font-family="Arial" font-size="11" fill="#333333">после 5 вниз к 1–4; стоп выше 5</text>

<text x="24" y="492" font-family="Arial" font-size="11" fill="#666666">отсев: боковик; 4→5 длиннее 2→3; один тег RPM. нужна геометрия + пачка тегов 5+</text>
<text x="24" y="508" font-family="Arial" font-size="11" fill="#888888">схема, не котировки. не Эллиотт, не 121</text>
</svg>
