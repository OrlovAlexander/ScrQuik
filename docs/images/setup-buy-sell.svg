<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Classic buy and sell RPM stacks">
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 700; }
    .sub { font-size: 12px; fill: #444; }
    .lab { font-size: 11px; fill: #333; }
    .zero { stroke: #88c; stroke-width: 1; }
    .ema { fill: none; stroke: #d44; stroke-width: 2; }
    .rpm { fill: none; stroke: #1a8f3a; stroke-width: 2.4; }
    .ema-up { fill: none; stroke: #d44; stroke-width: 2; }
    .rpm-up { fill: none; stroke: #c43; stroke-width: 2.4; }
  </style>
  <rect width="980" height="560" fill="#f7f7f4"/>
  <text x="24" y="28" class="title">buy / sell  :;0AA8G5A:89 AB5:</text>
  <text x="24" y="48" class="sub">small 8 middle >10 =865 =C;O 8 EMA, EMA ?0405B; current B>65 =865 =C;O 8 EMA; hist =865 =C;O 8 @0ABQB 2=87. sell  75@:0;>.</text>

  <text x="70" y="82" class="title" fill="#1a8f3a">buy</text>
  <text x="560" y="82" class="title" fill="#c43">sell</text>

