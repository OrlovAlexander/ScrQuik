[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrquik"
version = "0.1.0"
description = "QUIK Lua indicators and a Python analyzer for RPM setups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
include = ["analyzer*"]
